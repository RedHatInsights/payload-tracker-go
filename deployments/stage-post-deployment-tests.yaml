---
apiVersion: v1
kind: Template
metadata:
  name: payload-tracker-post-deployment-tests
objects:
- apiVersion: cloud.redhat.com/v1alpha1
  kind: ClowdJobInvocation
  metadata:
    name: payload-tracker-tests-${UID}
  spec:
    appName: payload-tracker
    testing:
      iqe:
        debug: false
        dynaconfEnvName: clowder_smoke
        filter: ''
        marker: 'smoke'
parameters:
- name: IMAGE_TAG
  value: ''
  required: true
- name: UID
  description: "Unique CJI name suffix"
  generate: expression
  from: "[a-z0-9]{6}"
